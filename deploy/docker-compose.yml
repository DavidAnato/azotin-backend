version: "3.8"

services:
  azotin-api-database:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - azotin-db-data:/var/lib/postgresql/data
    networks:
      - azotin-net-v01
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  azotin-api:
    image: 537124954160.dkr.ecr.us-east-1.amazonaws.com/azotin/backend:dev
    env_file:
      - stack.env
    ports:
      - 8000:8000
    depends_on:
      - azotin-api-database
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.azotin.rule=Host(`azotin.api.latoure.net`)"
      - "traefik.http.routers.azotin.entrypoints=https"
      - "traefik.http.routers.azotin.tls=true"
      - "traefik.http.routers.azotin.tls.certresolver=letsencrypt"
      - "traefik.http.services.azotin.loadbalancer.server.port=8000"
      - "traefik.http.routers.azotin.service=azotin"
      - "traefik.docker.network=kong-net-v01"
    networks:
      - azotin-net-v01
      - kong-net-v01
    restart: always

volumes:
  azotin-db-data:
networks:
  azotin-net-v01:
    external: true
    name: azozin-net-v01
  kong-net-v01:
    external: true
