version: "3.8"

services:
  azobatin-api-database:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - azobatin-db-data:/var/lib/postgresql/data
    networks:
      - azobatin-net-v01
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  azobatin-api:
    image: azobatin-api:latest
    env_file:
      - .env
    ports:
      - 8000:8000
    depends_on:
      - azobatin-api-database
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.azobatin.rule=Host(`azobatin.api.latoure.net`)"
      - "traefik.http.routers.azobatin.entrypoints=https"
      - "traefik.http.routers.azobatin.tls=true"
      - "traefik.http.routers.azobatin.tls.certresolver=letsencrypt"
      - "traefik.http.services.azobatin.loadbalancer.server.port=8000"
      - "traefik.http.routers.azobatin.service=azobatin"
      - "traefik.docker.network=kong-net-v01"
    networks:
      - azobatin-net-v01
      - kong-net-v01
    restart: always

volumes:
  azobatin-db-data:
networks:
  azobatin-net-v01:
  kong-net-v01:
