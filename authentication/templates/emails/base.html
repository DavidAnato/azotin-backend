<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Azotin{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#F7F9FC;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F7F9FC;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#FFFFFF;border-radius:12px;overflow:hidden;border:1px solid #E2E8F0;">
          <tr>
            <td style="background-color:#1C2541;padding:20px 28px;">
              <p style="margin:0;font-size:20px;font-weight:700;letter-spacing:0.08em;color:#FFFFFF;">AZOTIN</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 24px;color:#64748B;font-size:13px;border-top:1px solid #E2E8F0;">
              Cordialement,<br>L'équipe Azotin
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
